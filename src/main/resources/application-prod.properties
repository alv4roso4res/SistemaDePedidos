# Perfil de producao: PostgreSQL hospedado no Supabase.
#
# Nenhuma credencial fica neste arquivo. Tudo vem do ambiente (variaveis do
# container, do PaaS ou de um .env local que NAO e versionado).
# DB_PASSWORD nao tem valor padrao de proposito: sem ela a aplicacao falha
# na inicializacao em vez de tentar subir com um segredo fixo.

# DATASOURCE
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# POOL DE CONEXOES
# O Supabase limita conexoes simultaneas; mantenha o pool pequeno.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA, SQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SERVIDOR
# Plataformas de deploy costumam injetar a porta via PORT.
server.port=${PORT:8080}

# Nao expor detalhes de erro do servidor nas respostas
server.error.include-message=never
server.error.include-stacktrace=never
