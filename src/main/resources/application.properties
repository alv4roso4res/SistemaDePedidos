spring.application.name=SistemaDePedidos

# Perfil padrao: dev (H2 em memoria). Em producao, sobrescreva com a
# variavel de ambiente SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# A API serializa entidades JPA diretamente, entao as colecoes lazy precisam
# continuar acessiveis durante a escrita do JSON.
spring.jpa.open-in-view=true
